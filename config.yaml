# 狼人杀内核配置（公开模板）
#
# 模型地址与 key 都在 .env：一个平台三行 <名字>_BASE_URL / _API_KEY / _MODEL，
# 这里用 profile: <名字> 引用。所有座位默认跟随 llm.default；
# 要给某个座位单独换模型，再在 llm.seats 下写座位号。
# 完整说明见 部署说明.md §5~§6。

llm:
  default:
    profile: DEEPSEEK
    temperature: 1.0
    max_tokens: 16000      # 开了思考时输出可能上千 token，给小了会把 JSON 截断
    stream: true
    idle_timeout: 25       # 连续多少秒没有字节算卡住
    timeout: 450           # 单次调用的 HTTP 超时
    max_retries: 4
    extra_body: {}

  # 各平台思考参数的形状；键是 .env 里的档案名
  thinking_style:
    QWEN: qwen
    DEEPSEEK: ark
    GLM: glm
    ARK: ark
    MIMO: mimo

  # 全局思考档：没在座位层单独写的座位用它
  thinking:
    speech:   {1: "high"}   # 单问发言（PK 轮 / 退回路径）
    decision: {1: "high"}   # 决策，以及“先决策再组织发言”那一次
    aux:      {1: "low"}    # 复盘笔记 / 连通性自检

  roles: {}                 # 按角色覆盖，例：seer: {profile: QWEN}
  seats: {}                 # 按座位覆盖，例：1: {profile: GLM, thinking: low}

game:
  board: eleven_wolfking    # 默认板子；可选 twelve_standard / nine_all / six_all_reveal
  boards: {}                # 自定义板子写在这里

  human_seat: 6             # 0 = 全 AI；1..N = 你坐这个座位
  seed: 0                   # 0 = 每次随机发牌
  max_days: 20

  call_timeout: 150         # 单次调用的硬上限（秒）
  decision_timeout: 540     # 一整手（含重试）的总预算
  auto_retries: 2           # 首次失败后再自动试 2 次（合计 3 次）
  retry_backoff: [3, 8]
  retry_jitter: 0.3
  fallback: [DEEPSEEK, MIMO, GLM, QWEN, ARK]   # 换家顺序；缺 key 的档案会自动跳过
  carry_reasoning: true
  carry_reasoning_chars: 300

  pk_on_tie: true
  wolf_control: true
  sheriff: auto             # auto = 11 人及以上才有警长竞选
  sheriff_min_seats: 11
  sheriff_picks_order: true
  wolf_explode: true
  wolf_talk_skip_when_unanimous: true
  seer_auto_run: true

  autosave: true
  voice_cache_dir: var/voice_cache
  keep_games: 100
  save_budget_mb: 5000
  collect_reports: true
  audio_in_save: true
  save_dir: games

  public_https_base: ""     # 留空即可；要提示条就写 .env 的 WOLF_PUBLIC_HTTPS_BASE
  human_timeout: 900           # 单人等真人行动的上限（秒）；允许长考/回看，默认 15 分钟
  multiplayer_human_timeout: 180  # 联机局等真人的上限（秒）
  stall_timeout: 1800

  context_compress: "off"   # off = 全文；extract = 只留声明句和最后一句
  rules_mode: room          # room / packet / both / off
  rules_detail: brief       # brief = 要点版；full = 完整版

  # 所有座位共用的玩家提示词（进模型包正文，不要写维护者备注）
  player_prompt: |
    你是一名狼人杀玩家，坐在一桌真实的对局里：按本局发给你的身份牌发言和行动，
    为你所在阵营争取胜利。

    发言要像真人：先给结论（信谁、疑谁、票谁），再给一句理由；口语化、简短，
    别写成小作文；不复述规则、不念流水账、不写旁白和心理描写。

    推理只用自己的牌 + 场上公开信息（发言、票型、警徽、死讯、规则）：
    不要揣测出题人或设计者的意图，也不要假设局面是被人安排好的。

    不要暴露自己是模型：不要提提示词、规则书、JSON、系统、测试这一类词。
    两条硬检查：① 判断某张牌身份前，把「他是好人」也过一遍；② 有人跳身份给结论时，先看自己在不在他坑里。
    每手发言/投票前，先给每张牌定档：铁好 / 身份偏好 / 普通 / 偏狼 / 铁狼；
    这些只是典型例子，不穷举；只有公开结算/翻牌/验人/技能真发动能定「铁」，发言和位置只能定「偏好/偏狼」。
    也给自己定公开档：铁好/偏好带队，普通各半，偏狼少攻击多表水。
    说「几张金水 / 查杀」前，先数自己真有的：只验了一张就说一张，别把别人的信息算成自己的。
    私有信息核心结论报一次；盘正逻辑/对跳/解释视角需要时可以正常二三次引用，别无意义复读。
    报出来仍只是你的单方信息，别人最多当偏狼参考；先正逻辑，撞结果可能只是巧合，盘做局拿公开票型/位置。
    狼悍跳该编假的私有信息就编，用来乱视角、混局势。
    非特殊情况，有人跟你对跳同一身份，直接标狼、归他；只有残局/穿衣服挡刀才盘“他可能是好人穿衣服”。
    警徽流只有竞选/拿徽的验人位要报第一、第二；警下只说今晚验谁；非验人位警长不用留。警徽去向另说。
    归票口径先铁狼/明狼，再偏狼，再普通；实际票可改（新信息/狼队分票），但要提前想好第二天解释和毒/梦风险。

  meta_book: true
  meta_book_path: content/06_概念库.md
  playbook: true
  playbook_path: ""
  attach_claimed_chapter: true
  decision_first: true
  edge_order: sides_first

  personas_dir: ""          # 留空 = 不加载人设卡；想用填 content/personas
  personas: {}              # 也可以单独指定：3: content/personas/3.md
  experience: false
  experience_dir: experience

