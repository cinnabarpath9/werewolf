# 狼人杀内核配置
#
# ── 模型地址和 key 在哪？──
# 都在同目录的 .env 里，一个平台三行（Base URL + Key + 模型名）：
#
#     QWEN_BASE_URL=https://maas.qianwenaiapi.com/compatible-mode/v1
#     QWEN_API_KEY=sk-xxx
#     QWEN_MODEL=qwen3.7-plus
#
# 这里只写 `profile: QWEN` 去引用它。这样换平台只改一个地方，也不会把 key 抄错。
#
# 座位级路由：每个座位可以用**不同的平台、不同的 key、不同的模型**。
# 优先级：llm.seats[座位号]  >  llm.roles[角色]  >  llm.default
#
# 提示：多平台多 key 只解决"限流/记账/故障隔离"，跟"谁能看到什么"无关 ——
#       信息隔离永远由代码里的上下文装配保证，不受 key 数量影响。

llm:
  default:
    profile: QIANFAN_GLM    # 兜底平台（2026-11-02：ds/glm 迁千帆；52pay 那把 GLM key 已失效）
                            # 可选档案（都在 .env 里，一把 key 一组）：
                            #   QWEN / GLM / DEEPSEEK  → api.52pay.com（统一中转）
                            #   HAIKU                 → api.52pay.com，claude-haiku-5-5（4/10 号用）
                            #   DOUBAO                → 同一中转的 doubao-seed-2.1-turbo（本次没用）
                            #   ARK                   → 火山方舟，Doubao-Seed-2.1-lite（1/7 号用）
                            #   MIMO                  → api.xiaomimimo.com，mimo-v2.6-flash（5/11 号用）
    temperature: 1.0
    max_tokens: 16000       # ⚠️ 开了思考时输出可能上千 token，给小了会把 JSON 截断
                            #    （deepseek/lite 那种思考链算进输出，4000 时正文会被截空）
    # 流式请求（2026-10-10 晚）：上游"接了请求却不吐字节"时，非流式只能干等到总超时
    #   （实测 300 秒），那时整手预算已经烧光、没机会重试。流式下思考链是连续吐的，
    #   所以 **连续 idle_timeout 秒没有任何字节 = 真卡住** → 立刻判失败 → 走退避重试。
    stream: true
    idle_timeout: 25        # 连续多少秒没字节算卡住（作者定：50 秒不吐字就判抖动）   # ⚠️ 2026-10-11 从 50 收到 25
    # 实测依据（真实包体、流式）：千问思考链最长空档 13.9s、MiMo 3.2s —— 真卡住时是**整段静默**
    #   ⇒ 25 秒留约 1.8 倍余量，比 50 秒更早发现抖动。
    # ⚠️ 判据是「没有任何字节」，**不是**「没有正文」：千问要 129s 才吐第一句正文、MiMo 要 399s，
    #   按「没正文」判定会把每一次正常调用都砍掉重试。
    timeout: 450            # ⚠️ 全开最大思考时单次可能 60~300s，超时必须给宽，否则会误判超时
    max_retries: 4          # 上游（中转站）波动时的自动重试次数：首次失败后**再试 4 次**
                            # （退避 1.5/3/4.5/6 秒，总等待 ≤15 秒）。
                            # 4 次都失败 → 引擎暂停整局，手机弹窗问你：
                            #   再试一次 / 跳过这一手（按规则随机处理）/ 放弃本局
                            # 401/400 这类"重试也没用"的错误不会白试，会直接进弹窗。
                            # 座位级也能单独写：llm.seats[3].max_retries
    # retry_sleep: 1.5      # 上面那串退避的**基数**（第 n 次等 min(基数*n, 基数*4) 秒）。
                            # 不写就是 1.5 秒 = 1.5/3/4.5/6，与 2026-10-07 定的口径一字不差。
                            # ⚠️ 只有测试会写小值（`tests/stall-config.yaml` 用 0.1）——
                            #    那是为了把"重试 → 弹窗 → 继续"整条链快速走完；**生产别动它**。
    extra_body: {}          # 基础参数（下面的思考档位会覆盖它）

  # ── 思考强度：按「任务类型 + 第几天」决定（天数向上取，第 5 天用第 3 天那档）──
  #   off  = 关思考                    ~8s     事实题 72%
  #   low  = reasoning_effort=low      ~16s    事实题 90%
  #   high = reasoning_effort=high     ~114s   事实题 100%
  #
  # ⚠️ 2026-10-06 用户指定：**五个模型都不关思考**；发言单独降一档（见下）。
  #    实测依据：一局里"发言类调用"占 36%（121 次调用里 43 次是发言），
  #    发言是"把已经拿到的东西说人话"，而**决策**（投票/验人/用药/刀人/开枪）才是
  #    72%→100% 那 30 个百分点所在 —— 项目自己的 bench 结论（tools/bench_thinking.py）。
  #    发言降到 low 而不是 off：一次发言调用里其实混着判断（跳什么身份、怀疑谁、
  #    要不要点票），完全不想会让"跳身份/报怀疑"变随意。
  #    想更好：speech 改成 {1: "low", 3: "high"}（前两天快、第 3 天起发言也全力，约多 15 分钟）。
  #    想更快：speech 改成 {1: "off"}（约省 30%，但跳身份/怀疑对象会更随意）。
  #
  #    ⚠️ 哪些任务算"发言档"（这是代码里的口径，别以为所有"要说话"的都降了）：
  #       low（发言档）  ：speech（每天的依次发言，PK 发言也是它）、reflect（自己的推理笔记）
  #       high（决策档） ：sheriff_speech（竞选发言 —— 跳身份就在这一刻，值得想）、
  #                        last_words（遗言 —— 最后一次传信息）、
  #                        vote / sheriff_vote / sheriff_run / badge / wolf_talk /
  #                        wolf_kill / seer_check / witch / guard / hunter_shoot
  # 每家平台认的思考参数名不一样（qwen 认 enable_thinking/thinking_budget；
  # 豆包/智谱认 thinking.type；小米认 thinking.type（+低档的 reasoning_effort）；Haiku 认 reasoning_effort）。
  # ⚠️ 座位层不要再手写思考**参数**（enable_thinking / thinking.type / reasoning_effort）——
  #   那会盖掉整张档位表（2026-10-07 实测：1/7/4/10 号因此一直满血思考，1号平均 65 秒）。
  #   ⚠️ 但座位层写 `thinking: <档位名>` 是**允许的、也是现在的主力做法**（2026-10-11 深夜起
  #      每个座位一个档位）。**要关思考请写 `thinking: "off"`（带引号）**——YAML 会把裸 off
  #      解析成布尔 false，那会被静默丢掉、回落满档；写 `disabled` 也会被当错名丢掉。
  #      这个坑的来龙去脉见 docs/归档/归档-待完善清单.md E56。
  thinking_style:
    QWEN: qwen
    DEEPSEEK: ark          # 2026-10-07 起走火山方舟，认 thinking.type
    GLM: glm
    ARK: ark
    # 小米 MiMo：官方只有 thinking.type（开/关），且默认就是开；
    # 低档另加 reasoning_effort=low（2026-10-11 深夜四档重测：真的生效），所以单独一套。
    MIMO: mimo
  thinking:
    # ⚠️ 这是**全局兜底**：座位层没单独写 thinking 的座位用它（现在只有 3/9 与座位 6 走它）。
    #    ⚠️ 2026-10-10 那句「全程满思考」已被 **2026-10-11 深夜的最终阵容**取代 ——
    #    五家都在座位层各写了档位（1/7=low、2/8=low、4/10=low、5/11=low；3/9 不写=走这里的 high），
    #    见下面 seats 的注释与 docs/归档/归档-待完善清单.md E56。**别再照旧口径把某座位改回 high**。
    #    （文档里"决策发言＝先最高思考出决策、同一次调用里组织发言"说的是 `speech_plan`，
    #      它本来就属于决策档；改这里影响的是**单独问一次发言**那条路：PK 轮 / 退回路径。）
    speech:   {1: "high"}    # 座位上的单问发言（PK 轮 / 退回路径）
    decision: {1: "high"}    # 座位上的决策、以及"先决策再组织发言"那一次
    # 非座位的活（复盘笔记 / 连通性自检）—— 作者口径：干总结的活，低档就够，不必满思考
    aux:      {1: "low"}

  # ── 换手（替补）那一手用哪一档思考：按**目标档案**覆盖（2026-10-12 加）──
  #    ⚠️ **这一整段不写 = 与以前一字不差**（替补沿用「本座位档位 × 目标档案风格」），
  #       所以下面全部是注释；要用就自己取消注释、只写你关心的那几家。
  #    起因（真局实测 games/game-20261012-105959.json）：5 号是 MIMO + `thinking: low`，
  #    第 1 天一次调用顶到 420 秒上限 → 换 DEEPSEEK 顶班，那一手发了
  #    `{thinking: {type: enabled}, reasoning_effort: low}`、36.09 秒 / 5,384 tokens；
  #    而同局 DS 的两个**原生**座位（2/8，当时 `thinking: "off"`；2026-10-15 已改成 `low`）只要 1.5~2.0 秒 / 36~824 tokens。
  #    ⚠️ 那**不是**「把 MiMo 的参数带过去了」（那是误解，查代码核实过）：
  #      · 参数**名**一直跟着**目标档案**走 —— `resolve_profile` 用的是
  #        `thinking_style_for(cfg, 目标档案)`（wolf/routing.py:429）；
  #      · 只有「哪一档」是本座位自己的（座位层 `thinking: low`，wolf/routing.py:421-427）；
  #      · DEEPSEEK 在下面的 `thinking_style` 表里登记的是 **`ark`**，而 ark 的 low 与
  #        mimo 的 low **恰好同形**（都是 thinking.type=enabled + reasoning_effort=low），
  #        所以从参数上看不出区别 —— 把同一个座位换到 QWEN 就会发
  #        `enable_thinking / thinking_budget`，形态完全不同（闸门 tests/t_fallback_thinking.py 钉着）。
  #    结论：想给「换到某一家」指定另一档（例如 DS 顶班时干脆关掉思考），就在这里点名那一家：
  #
  #  fallback_thinking:
  #    DEEPSEEK: off              # 换到 DS 顶班时关思考（YAML 裸 off 也认，见 E56）
  #    QWEN: low                  # 换到千问时走中档（它认 enable_thinking/thinking_budget）
  #    MIMO: {decision: high}     # 也可以按组写：只覆盖点名的组，其余沿用座位层档位
  #
  #    · 键 = `game.fallback` / `thinking_style` 里用的**档案名**（大小写不敏感）；
  #    · 值 = `off` / `low` / `high`，或 `{speech: …, decision: …, aux: …}` 那种分组表
  #      （分组表**逐组、逐天**覆盖，没点到的组/天沿用座位层 —— 与上面 `thinking` 同口径）；
  #    · 只影响**换手的那一次调用**，不影响座位自己的主档（`resolve` 根本不读它）；
  #    · 档位名写错、档案名拼错都会在开跑预检里报人话（不再"配了却永远不生效"）。
  #    来龙去脉与验收数字见 docs/归档/归档-待完善清单.md E58；闸门 tests/t_fallback_thinking.py。

  # 按角色覆盖（角色是 wolf / seer / witch / hunter / guard / villager）
  # 例：预言家最吃"精确回忆"，给它换强模型
  roles: {}
    # seer:
    #   model: qwen3.8-max

  # 按座位覆盖（优先级最高）。每个座位可以来自不同平台、用不同的 key。
  #
  # ── 2026-10-06 用户定的排法（十一人板子 + 5 个模型 × 每人 2 个座位）──
  #   座位 6 = 真人玩家；10 个人设卡按"性格配音色"分到其余 10 个座位。
  #   同一个模型的两个座位**温度必须不同** —— 这是压"同一个脑子说话像一个模子"的主要手段，
  #   所以温度是按人设的脾气定的，不是随便给的：
  #     低（0.6~0.8）= 城府/寡言/控场型，稳、话少、不轻易改口
  #     中（0.9~1.15）= 讲理/傲娇/装大人型
  #     高（1.2~1.35）= 掀桌/硬刚/双魂型，敢冲、前后更容易不一致
  #   模型↔座位按 api.md：豆包-中 1/7 · deepseek-关思考 2/8 · glm-高 3/9 · haiku-中档 4/10 · mimo-中档 5/11
  seats:
    # 豆包 2.1-lite @ 火山方舟（1 号 朔望舒 控场 / 7 号 赵徽柔 傲娇硬刚）
    #   ⚠️ 2026-10-11 深夜作者定：1/7 **走中档**（B 组 26 题实测：中档 81% / 53s ＞ 高档 73% / 313s；
    #      低档 65% ⇒ 能降中档、不能关）。
    #   （历史：这两行原来是千问 —— 千问要手写 enable_thinking，给它发 reasoning_effort=high
    #     会偶发 503；千问 2026-10-11 深夜**下桌**，只留在 game.fallback 里当替补。）
    1:  { profile: ARK, model: Doubao-Seed-2.1-lite, thinking: low, temperature: 0.7, max_tokens: 32000, timeout: 450 }
    7:  { profile: ARK, model: Doubao-Seed-2.1-lite, thinking: low, temperature: 1.1, max_tokens: 32000, timeout: 450 }
    # deepseek（2 号 沈倩宁 掀桌 / 8 号 赵泠汐 讲理阴阳）
    #   ⚠️ max_tokens 必须 ≥16000：思考链算进 completion_tokens，给小了正文会被截空
    #   ⚠️ `thinking: "off"` = **有意关思考**（2026-10-11 深夜作者定）：固定卷三档实测
    #      关思考 88% / 2,926 tok / 3s ＞ 中档 81% ＞ 高档 77%。
    #      **引号不能省**：裸 off 会被 YAML 当布尔 false、被静默丢掉后回落满档（见 E56）。
    # 2026-10-15 作者指示「模型改适合档位」：本座位由 off（关）改 low（中）。依据：34 道终版卷中 76% > 高 74% > 关 62%（旧 26 道卷上关 88% 最优 ⇒ 两卷冲突）；且真局里 DS 那次「同一份判断自相矛盾」（座位 8）正发生在关档下。⚠️ 代价：单次 1.5~2s → 约 30s；回退就把 thinking 改回 off（带引号）。
    2: { profile: QIANFAN_DS, temperature: 1.0, max_tokens: 20000, timeout: 450, thinking: {speech: high, decision: high, aux: low} }
    # 2026-10-15 作者指示「模型改适合档位」：本座位由 off（关）改 low（中）。依据：34 道终版卷中 76% > 高 74% > 关 62%（旧 26 道卷上关 88% 最优 ⇒ 两卷冲突）；且真局里 DS 那次「同一份判断自相矛盾」（座位 8）正发生在关档下。⚠️ 代价：单次 1.5~2s → 约 30s；回退就把 thinking 改回 off（带引号）。
    8: { profile: QIANFAN_DS, temperature: 0.9, max_tokens: 20000, timeout: 450, thinking: {speech: high, decision: high, aux: low} }
    # glm-5.3-flash —— 2026-10-09 用户要求：**改走火山端点**（模型不变，只换服务方）。
    #   做法：`profile: ARK` 拿火山的 base_url 与 key，再显式把 `model` 压成 glm-5.3-flash
    #   （路由里显式 model 优先级最高；这样**不需要额外的 key**，用现成那把 ARK key）。
    #   想换回中转站：把这两行的 `profile: ARK, model: glm-5.3-flash` 改回 `profile: GLM`。
    # ⚠️ 3/9 是货真价实的 GLM 模型，但**走火山方舟的端点**（2026-10-10 作者确认：豆包/dsv4.1/glm5.3f
    #    都走火山、密钥共用）。火山上 glm **不接受 thinking.type=disabled**（400）—— 能开不能关，
    #    所以这两个座位**别配 off 档**（glm 风格的 off 已改成什么都不发兜底）。
    3:  { profile: QIANFAN_GLM, temperature: 1.2, max_tokens: 16000, timeout: 450, thinking: low }
    9:  { profile: QIANFAN_GLM, temperature: 1.05, max_tokens: 16000, timeout: 450, thinking: low }
    # claude-haiku-5-5 @ 快米兔（4 号 赵令仪 城府 / 10 号 沈栖迟 装大人）
    #   ⚠️ 2026-10-11 换人：豆包（Doubao-Seed-2.1-lite）**下桌** —— 它不抖，但真的慢
    #   （同一份卷子单组 100~190 秒、平均 49 秒/次，还会把排在它后面的模型一起堵住：引擎串行等）。
    #   Haiku 5.5 实测又快又准：新卷子 83%（与 GLM 并列第一）、平均 15 秒/次、三个快模型里 token 最便宜。
    #   ⚠️ 它的思考链**不回传**，但 reasoning_effort=high 实测有效（完成 token 881→1653）。
    4:  { profile: HAIKU, temperature: null, max_tokens: 20000, timeout: 450, thinking: "off" }
    10: { profile: HAIKU, temperature: null, max_tokens: 20000, timeout: 450, thinking: "off" }
    # mimo（5 号 白清弦 寡言定场 / 11 号 安迟迟 高攻纸防）
    #   ⚠️ 2026-10-11 深夜作者定：5/11 走**中档**（`thinking: low`）—— 26 题实测中档 81%、
    #      决策题 100%；高档 85% 但要多 5.5 倍时间（154s），而且大包有交白卷风险。
    #   ⚠️ MiMo 的思考**无上限膨胀**（同一包实测 5.6k→6.3 万字，差 10 倍）——
    #      max_tokens 16000 时大包会**交白卷**（思考吃满、正文空白）；抬到 32000 能答，但偶尔要 500 秒+。
    #      要更快就在这两行把 low 换成 `thinking: "off"`（小米只有开/关，没有预算旋钮；掉约 12 分）。
    #      它思考时**一直吐字节**，所以 idle 看门狗抓不到它的长尾（实测最长空档只有 3.2 秒）。
    5:  { profile: MIMO, temperature: 0.8, max_tokens: 32000, timeout: 450, thinking: low }
    11: { profile: MIMO, temperature: 1.25, max_tokens: 32000, timeout: 450, thinking: low }
    # 6 号是真人玩家（不配模型）
    #
    # 如果 1.3 以上那几档开始"说胡话 / 格式出错"，把最高那两档降到 1.15 就行。

  # 想换成别的平台：在 .env 里加一组 <名字>_BASE_URL / _API_KEY / _MODEL，
  # 然后这里写 profile: <名字>。手机面板也能直接填（面板认 <名字>_API_KEY 这种写法）。

game:
  # 板子决定人数和角色构成。内置 **4 张**（手机端板子按钮按**这个顺序**排，2026-10-30 定）：
  #   eleven_wolfking （**当前默认**：3 狼 + 1 狼王 + 预女梦愚 + 三张民牌；**首夜无刀**）
  #   twelve_standard （12 人预女猎白：4 狼 + 预女猎白 + 4 民；屠边；有警长）
  #   nine_all        （9 人常规屠城·暗牌：3 狼 + 预女猎 + 3 民；屠城；没有警长）
  #   six_all_reveal  （6 人屠城·明牌：2 狼 + 预女 + 2 民；屠城 + **出局亮身份**）
  # 想加别的人数/花板子，就在下面的 boards 里自己写一份（校验会自动拦坏板子）。
  # ⚠️ 旧的 eleven / eleven_standard / eleven_dream / eleven_guard 已**退役**（不在这份清单里，
  #    写进 board 会直接报「没有这个板子」）；定义存档见 wolf/retired_boards.py 与
  #    docs/板子备份_已删除.md（想给玩家重新开放：在下面 boards 里写一份自定义板子）。
  board: eleven_wolfking  # 2026-10-10 作者拍板（第三版）：**狼王版**成为默认板子。
                        #   · 阵容：**3 狼 + 1 狼王** + 预言家、女巫、**摄梦人**、**愚者** +
                        #     **守墓人 / 养鸦人 / 幸运儿**（三张民牌），有警长。
                        #   · **首夜无刀**：第 1 夜狼队/女巫/摄梦人零调用，只跑一次预言家验人
                        #     （首夜调用数 11 → 1）；女巫与摄梦人从**第 2 夜**起才行动。
                        #   · **狼王**：任何原因出局（含**被毒**、含自爆）都能当场带走一名好人、
                        #     **不能带狼队友**、带人公开指定；自爆 = 白狼王式（亮身份→带人→进夜）。
                        #   · **结算次序：死亡结算 → 狼王带人 → 再判屠边**（狼王临死带走某一边
                        #     最后一张好人牌，照样算狼队屠边成功）。
                        #   为什么换（作者观察 + 三局真实思维链）：旧板子"首夜女巫能自救"⇒
                        #   狼**自刀骗药**即使成功也吞不掉两瓶药、反而白送一狼（EV 为负）⇒
                        #   三局里 77/20/6 处提到自刀全部主动放弃 ⇒ 狼永远走"外置位中心开刀"
                        #   ⇒ **银水没人质疑、好人白拿一条确定信息**。改机制，不是改打法书。
                        #   ⚠️ 旧板子 `eleven_dream`（预女梦愚）**已退役**（2026-10-30）：
                        #     产品面板里不再提供；想玩要按上面 boards 的写法自己挂一份自定义板子。

  # 自定义板子：写自己那套规则，任意人数（5~18）
  # 可选板子级开关（不写就是默认）：
  #   win_rule: sides（屠边）/ all（屠城）
  #   first_night_quiet: true      首夜无刀（第 1 夜狼队/女巫/摄梦人都不动）
  #   reveal_on_death: true        出局亮身份（任何人出局时公开他的身份牌）
  boards:
    # 我自己的 8 人局:
    #   roles: [wolf, wolf, wolf, seer, witch, hunter, villager, villager]
    #   win_rule: sides      # sides = 屠边（杀光神或杀光民）；all = 屠城
    #   desc: 我们线下就是这么开的
    # 快节奏 6 人局不留女巫:
    #   roles: [wolf, wolf, seer, hunter, villager, villager]
    #   win_rule: sides

  human_seat: 6             # 0 = 全 AI；填 1..N 表示你坐这个座位（命令行 --human 可覆盖）
                            # 本次按 api.md：6 号位 = 真人玩家
  seed: 0                   # 0 = 每次随机发牌（每局身份都会重排）
  max_days: 20              # 防止模型互相拖到天荒地老
  # ── 上游"挂住"的两层保险（2026-10-07 实测踩过：MiMo 一次调用挂了，手机端
  #    只显示"11号 正在思考…"一动不动，进程 CPU 完全不涨 —— 那是上游没回包）──
  #   call_timeout：单次调用的硬上限。到点就把这一手当失败，进入重试/暂停链路。
#   ⚠️ 2026-10-10：300 → 420（豆包实测 244 秒、千问去掉上限后顶穿 300）。
#      HTTP 客户端的 timeout 必须**比它再宽**，否则会先被 httpx 砍掉。
  #   decision_timeout：一整手（含重试）的总预算。超过就不再重试，直接把决定权交给你。
  # ⚠️ 用户口径（2026-10-07）：**最多让模型想 300 秒再砍**，不许砍在思考中途 ——
  #    砍一半它得从头重想，反而更亏。所以单次上限是 300 秒。
  # ⚠️ 整手预算必须**大于**单次上限：第一版两条都写 300，结果一次挂住就把预算吃光 ——
  #    重试与"换一家顶上"根本不会发生（2026-10-07 实测：9号 6 次调用 4 次失败，全卡在 300 秒，
  #    而且一直没换到别的模型，用户看到的就是"9号两次都掉线、也没转别的模型"）。
  #    现在 420 = 一次满额尝试 + 约 120 秒给替补（快模型 10~40 秒就能答完，够用）。
  call_timeout: 420
  decision_timeout: 540
  # ── 自动重试（2026-10-07 用户定的口径：合计最多 3 次尝试）──
  #   auto_retries=2 → 第一次失败后再自动试 2 次（合计 3 次），3 次都失败才弹窗问你。
  #   退避 3s → 8s（带 ±30% 抖动，避免多座位同一秒一起撞上游）；退避也只花剩余预算。
  #   挂住（读超时）在客户端那层**不重试**（同一家再撞还是挂），统一由这里带可见退避重试。
  auto_retries: 2
  retry_backoff: [3, 8]
  retry_jitter: 0.3
  # ── 换家顶上（2026-10-07 用户定：要换，而且要把替补的思路摘要传给原模型）──
  #   上游失败要重试时，按下面的顺序换一家平台顶上（跳过这个座位自己那家）。
  #   实测两次故障都是单家问题（GLM 跑飞 724 秒、MiMo 挂死不返回），换家第二次基本能过。
  #   换家时：host/key/model 用目标档案的；温度/上限/思考档保留这个座位自己的设定。
  fallback: [DEEPSEEK, MIMO, GLM, QWEN, ARK]
                          # 注：GLM 档案仍留着做兜底（走 52pay 中转）；3/9 号座位已改走火山端点。
  carry_reasoning: true       # 替补的那一手，把它的思考链摘要写进该座位私有经历
  carry_reasoning_chars: 300  # 摘要留多少字（0 = 只记"谁代打的"，不留思路）
  pk_on_tie: true           # 平票时：被票的几人各再发言一轮（PK），然后只在她们之间重投；
                            # 重投仍平票 → 本轮无人出局。关掉就是"平票直接无人出局"。
  wolf_control: true        # 狼人控场结算。判定是「存活狼数 ≥ 存活好人数」**并且**
                            # 好人已无夜间反击能力（预言家/女巫/猎人都不在了）——
                            # 只要这几种还有活人，就给他们最后一夜。
                            # 关掉（false）则完全不做控场判定，残局交给屠边/屠城。
  sheriff: auto             # 警长：auto（默认）= 11 人及以上的板子才有警长竞选；
                            # true = 所有人数都开；false = 关掉。
                            # 规则：第一天**先结算夜里的死亡**（第一夜死者有遗言），再选警长；
                            # 竞选者各一轮发言且**没有投票权**；非竞选者投票但**不能发言**；
                            # 凭票当选，平票就打一轮发言 PK 再重投，**再平票才流失**；
                            # 无人上警/全员上警也是流失；警徽在投票时算 1.5 票；
                            # 警长出局（被放逐/被刀/被枪）可以传给别人或撕掉。
  sheriff_min_seats: 11     # auto 时的门槛（用户定的规则：11 人及以上有警长）
  # 警长每天自选发言方向（顺序 / 逆序）—— 用户 2026-10-08 要求。
  #   顺序 = 从警长的下一位开始按座位号往上数，警长最后说；
  #   逆序 = 从警长的上一位开始往下数，警长照样最后说（听得最全）。
  # 代价：**有警徽的局每天多一次调用**（警长座位的决策档）。关掉（false）就退回老口径
  #   （永远是"警长下一位先说"）。
  sheriff_picks_order: true
  # 狼人自爆（用户 2026-10-08 加的变版规则）：
  #   时机：**上警名单已经确定、竞选发言还没开始** —— 四狼各做一次决策（多数同意才爆）。
  #   后果：自爆的狼当场出局并亮明身份、**警徽直接流失**（竞选作废）、今天不再发言不再投票，
  #         **当夜照常刀人**（所以它是"吞警徽 + 当晚刀掉真预言家"的打法）。
  #   代价：只有开竞选的那一天多 4 次决策调用（关掉 = false 就没有这个窗口）。
  wolf_explode: true
  # 狼队夜间成本折中（作者 2026-10-09 批准）：四头狼私下定的刀口**完全一致**时
  #   **跳过夜聊**（省 len(wolves) 次调用）；只要有一头狼想刀别人就照常讨论。
  #   关掉 = 恢复「每晚都讨论」。
  wolf_talk_skip_when_unanimous: true
  # 本板子**预言家锁定上警**（作者 2026-10-10）：不给他发上警决策调用，直接算候选人（前置位）。
  #   理由：不上警只有「也许不被秒爆砍死」一个好处，但 100% 丢警徽；本板子有幸运儿的守护
  #   + 摄梦人的梦守，狼要砍死预言家得连爆几狼。关掉 = 恢复「也问他一次」。
  seer_auto_run: true
  # 自动存盘（用户 2026-10-08 的血泪教训：打了一个半小时的局，进程一没就全没了）：
  #   每过一个阶段（夜里↔白天）就把**同一个**存档文件覆盖写一次；收尾时再覆盖一次并清掉
  #   `in_progress` 标记。崩了/关了浏览器最多只丢最后一个阶段，也不会产生半截存档堆积
  #   （一局只会多出一个文件）。写盘走"临时文件 + 原子替换"，中途断电也不会留下残破 JSON。
  autosave: true
  # 运行期产物目录：语音缓存放这里（不想放 var/ 就改成 voice_cache）
  voice_cache_dir: var/voice_cache
  # ── 存档留档（用户 2026-10-07 定的：留 100 局）──
  #   实测：一局 ≈ 3 MB JSON（含每次调用的提示词与思考链留痕）+ 8~16 MB 语音。
  #   所以 100 局 ≈ 1.2~1.9 GB，用户给的额度是 5 GB —— 留得下，还有富余。
  #   keep_games：最多留几局（0 = 不限）；save_budget_mb：总预算兜底，超了从最旧的开始删
  #   （删一局 = JSON + 它的语音目录一起删，不留孤儿文件）。
  keep_games: 100
  # 对局统计（2026-10-31）：对局结束时问玩家「要不要把这局结果交给房主算胜率」。
  # 关掉 = 客户端不问、接口也拒收；只存摘要（胜负/天数/角色），不存发言与思考，存在 var/reports/。
  collect_reports: true
  save_budget_mb: 5000
  # 发言的语音一起留档（复盘时点 🔊 直接播存档里的音频，不重新合成）
  audio_in_save: true
  save_dir: games
  # ⚠️ 2026-10-12 加（**只加说明，数值一个字没动**）：mock 局（`--mock` / 离线演练 /
  #   浏览器页面测试开的那些局）**不写这份 save_dir 的根目录**，一律落在 `games/_mock/`
  #   子目录（见 `server.py::_mock_save_dir`）。两条理由：
  #     ① 复盘列表只看根目录的 `game-*.json`（`/api/games` 与 `tools/review.py` 都是非递归的），
  #        mock 局不会把用户的复盘列表刷屏；想看它们：
  #        `python tools/review.py --save-dir games/_mock --list`；
  #     ② `prune_saves()` 现在**先删 mock、再删真局**（判据看存档内容：`transcript` 里有没有
  #        非空 `model`）—— 上面 keep_games 那 100 局的窗口不会再被 mock 挤掉真局。
  #    起因：2026-10-12 实测 `games/` 100 份存档里只有 9 份真局，而旧的 prune 从最旧的开始删
  #    ⇒ 那 9 份真局正是下一批会被删的。来龙去脉见 `docs/归档/归档-待完善清单.md` E57。
  # 给手机用的 **https 地址**（Tailscale serve 给的）：http 页面里浏览器不给麦克风 API、
  # 也不允许"安装到应用列表" —— 前端会读它显示一条提示条，把该用的地址直接写出来。
  public_https_base: ""          # 留空也行；你自己的 https 地址写 `.env` 的 WOLF_PUBLIC_HTTPS_BASE（那样不会进仓库/发布包）
  human_timeout: 900        # 手机端等你行动的秒数，超时就跳过这一手
  # 联机局专用：多个人一起玩时，一个人去倒水不该让全场等 15 分钟。
  # 取 min(human_timeout, 这个值)；单人局仍然用上面的 900 秒。
  multiplayer_human_timeout: 180
  # ── 规则书放哪儿（`规则书.md` 是唯一权威，两版同源：完整版给人看，要点版进模型）──
  #   room（默认）= 开局当**公开公告**写进台账（所有座位每次调用都看得到），手机上另有「规则」按钮
  #   packet      = 塞进每个座位的提示词顶部（位置最显眼、明确是"给你的规则"）
  #   both        = 两边都放（会重复占 token，一般没必要）
  #   off         = 都不放（只有手机上能看）
  # 两种放置方式的实测对比：tools/rules_ab.py
  rules_mode: room
  rules_detail: brief       # brief（要点版 ≈650 tokens/次调用）/ full（完整版 ≈1300 tokens）
  stall_timeout: 1800       # 上游连续失败把对局暂停后，等你点按钮的秒数（默认 30 分钟）；
                            # 到点还没人管，就按「跳过（随机处理）」继续，免得永远挂着

  # ── 座位角色卡（原：一个模型演十一种人）──
  # ⚠️ 2026-10-07 起**默认不再用人设卡**：用户实测"加了姓名/性格/说话方式/打法策略之后，
  #    反而把模型的思路固定死了"，而且每个座位的语气差别不值那么多 token。
  #    10 张卡已备份到 `personas_备份_20261007_人设卡/`，`personas/` 现在是空的。
  #    想再用回来：把卡挪回 personas/，再把下面 personas_dir 填成 personas（代码没动）。
  #
  # 取代它的是下面两段**所有座位共用**的文本（见 wolf/tabletalk.py）：
  #   player_prompt：通用玩家提示词（每个座位一模一样）
  #   meta_book   ：概念与概率（发牌概率参考 + 使用纪律，内容在 content/概念库.md 的 frag:meta 段）
  #
  # ⚠️ player_prompt 是**进模型包的正文**（每个座位、每次调用都在最前面）——
  #    这里只写"模型该怎么做"，**不要写给人看的备注**（改了什么、为什么改、实测如何）。
  #    2026-10-11 前它末尾挂着一句「（2026-10-08 加最后这两句：实测有座位写了 4 万多字在猜…）」，
  #    那是写给维护者的，模型每次都在读。设计理由挪到本注释里：
  #    2026-10-08 加最后两段（不揣测出题人意图 / 不假设局面被安排）：实测有座位写了 4 万多字
  #    在猜「the designer 想要什么」，最后靠抛硬币定票 —— 那是无效推理还容易被带偏。
  #    若发现它反而变差，删掉"推理只用…"那一段即可。
  player_prompt: |
    你是一名狼人杀玩家，坐在一桌真实的对局里：按本局发给你的身份牌发言和行动，
    为你所在阵营争取胜利。

    发言要像真人：先给结论（信谁、疑谁、票谁），再给一句理由；口语化、简短，
    别写成小作文；不复述规则、不念流水账、不写旁白和心理描写。

    推理只用自己的牌 + 场上公开信息（发言、票型、警徽、死讯、规则）：
    不要揣测出题人或设计者的意图，也不要假设局面是被人安排好的。

    不要暴露自己是模型：不要提提示词、规则书、JSON、系统、测试这一类词。
    两条硬检查：① 判断某张牌身份前，把「他是好人」也过一遍；② 有人跳身份给结论时，先看自己在不在他坑里。
  meta_book: true             # 把「场外玄学（数学概率）」那段发给模型当参考
  meta_book_path: content/06_概念库.md   # 位置概率参考现在在《概念库》里（只取 frag:meta 那一段进包）
                                    # 2026-10-09：原《场外玄学.md》已并入《概念库》
  playbook: true              # 打法书：按**角色**发（通用 + 你这个角色的打法）
  playbook_path: ""                     # 空 = 默认「战术书 + 角色书」（2026-10-31 拆书）；改这个不用动代码
  # 狼「穿身份」参考章（2026-10-08）：狼报过某个身份（或还没报）时，把那个身份的
  # 打法书章节也附给它 —— 目的是让它**用那个身份的口吻说话**（用户反馈的真问题：
  # 悍跳狼会说「真预言家怎么怎么样」，用旁观者的口吻谈自己声称的身份，一句话就露馅）。
  #   · 还没报过身份的狼 → 默认附「预言家」章（第一天能抢的硬身份基本都是预言家，
  #     而「第 1 天悍跳预言家」正是最主流的狼打法；不这么给的话，它第一次开口时手上
  #     只有狼章，没东西可演）；报过之后 → 附它**最近一次**报的那个身份。
  #   · 只对狼生效（好人报身份不附，隔离不漏）；认不出的身份文本不会硬套章节。
  #   · 包体代价（2026-10-08 实测）：狼视角打法书 8174 → 8903 字（新增的那一节），
  #     再叠上参考章 —— 没报身份时兜底预言家章 = 狼包 10502 字；
  #     报过身份后按身份不同再加一次（含抬头的整段：预言家 ≈1.4K / 白痴 ≈1.8K /
  #     猎人 ≈2.4K / 女巫 ≈2.8K 字）。**关掉它狼包 = 9167 字**。嫌慢或嫌贵就关掉。
  #   · 关掉之后：狼只剩打法书「穿身份：跳什么就演什么」那一节的要点可参考，
  #     看不到预言家/女巫/猎人/白痴章节里更细的口吻与手法（那正是治「用旁观者口吻
  #     谈自己声称的身份」这个露馅点的东西，所以默认开）。
  attach_claimed_chapter: true
  # 边界口径：同一夜里"屠边完成"和"最后一狼被抓出来"同时成立时算谁赢。
  #   sides_first（默认，用户定的）：屠边优先 → 狼胜
  #   last_wolf_first：最后一狼先死 → 好人胜
  # ── 白天流程：决策在前、发言在后（用户 2026-10-07 定的口径）──
  #   开：先私下用高思考定下今天投谁（全员并发一轮），然后按这个决定发言，
  #       投票直接复用该决定 —— 发言与投票一致，决策也不会被自己的发言带跑；
  #       代价：本轮「别人的」发言不会改变它的票（决定在发言之前就定了）。
  #   关：老流程（先全员发言、再各自决策），能听完全场再投，但发言与投票可能打架。
  decision_first: true
  edge_order: sides_first
  personas_dir: ""            # 留空 = 不加载角色卡。想用回来：填 **content/personas**
                              # ⚠️ 路径是**相对项目根**（`werewolf/`）算的，而且必须写全
                              #    `content/personas` —— 只写 `personas` 会指向不存在的
                              #    `werewolf/personas`，结果是**静默一张卡都不加载**
                              #    （只在 /api/personas 里留一条 warning）。2026-10-11 修文档。
  personas: {}                # 也可以单独指定： 3: content/personas/3.md  或  3: 「你说话很短，爱用反问。」
  experience: false
  experience_dir: experience

# 语音：座位 → 音色（人设的性别跟音色要对上；听着不对就改这里，不用动代码）
#
# 可用音色一共 12 个：longanhuan / longmiao / longxing / longwan / longhua /
#   longxiaoxia / longyuan / longjielidou / longhuohuo / longsanshu / longzhe / longhan
#   （名字后面必须带 _v3.1，写错会直接合成失败）
#
# ⚠️ 2026-10-06：这 10 张人设卡**全是女性**，而原来 2/3/7/8 挂的是男声 → 已换女声。
#    女声只有 8 个、AI 座位有 10 个，所以 10 号跟 1 号、11 号跟 4 号**共用音色名** ——
#    但下面的语速/音高/语气指令不一样，听感仍然是不同的人（实测这三个旋钮都生效）。
#
# ── 想"加音色"有三条路（都不改代码）──
#  ① 换预设名：把 12 个可用名换着排（config 里直接写字符串就行，见文末示例）。
#  ② 调旋钮（**推荐**，不花钱、不用装东西）：每个座位可以写成字典：
#        voice: 音色名
#        rate: 语速 0.5~2.0（>1 更快）
#        pitch: 音高 0.5~2.0（<1 更低）
#        volume: 音量 0~100（默认 50）
#        instruction: 自然语言描述怎么念，例「语气冷、句尾不上扬」
#        seed: 固定随机种子（同一句话每次都一样，复现用）
#     实测（_verify_c_server/probe_voice_knobs.py，同一句话）：
#       语速 0.8 → 63620 字节 ／ 0.9 → 56515 ／ 1.1 → 46484 ／ 1.3 → 39379　✅ 单调生效
#       音高 0.85 → 70308 ／ 0.95 → 56515 ／ 1.1 → 42304　✅ 生效
#       语气指令三条 → 80339 / 54843 / 53589 字节　✅ 生效
#  ③ 声音复刻（克隆）：用 SDK 的 VoiceEnrollmentService（本机 dashscope 1.27.7 自带）：
#       from dashscope.audio.tts_v2 import VoiceEnrollmentService
#       svc = VoiceEnrollmentService(api_key=..., model="voice-enrollment")
#       voice_id = svc.create_voice(target_model="qwen-audio-3.1-tts-flash",
#                                   prefix="aba", url="<一段 10~30 秒干净样音的 URL>")
#       # 之后把 voice_id 当普通音色名填进下面的 voice: 即可；list_voices() 能列已建的
#     注意：样音要是干净人声（无背景音乐/混响），平台上通常还要实名，是否收费看平台。
voice:
  seats:
    # 1 号 朔望舒（控场总裁，38）：稳、慢、压得住场
    1: { voice: longmiao_v3.1, rate: 0.95, pitch: 0.95,
         instruction: "语气平稳从容，像在主持会议，句尾下沉" }
    # 2 号 沈倩宁（掀桌型，24）：快、冲、情绪外放
    2: { voice: longhuohuo_v3.1, rate: 1.15, pitch: 1.05,
         instruction: "语速快、情绪外放，带一点挑衅" }
    # 3 号 江离（硬刚+阴阳，24）：短句冲，不拖泥带水
    3: { voice: longjielidou_v3.1, rate: 1.12, pitch: 0.98,
         instruction: "短句、语气冲，不拖泥带水" }
    # 4 号 赵令仪（城府，42）：冷、慢、不露情绪
    4: { voice: longxiaoxia_v3.1, rate: 0.9, pitch: 0.9,
         instruction: "语气克制冷淡，停顿多，不露情绪" }
    # 5 号 白清弦（寡言定场，35）：低、慢、惜字如金
    5: { voice: longyuan_v3.1, rate: 0.88, pitch: 0.92,
         instruction: "平铺直叙，音量偏小，惜字如金" }
    # 6 号是真人玩家，不需要音色
    # 7 号 赵徽柔（傲娇硬刚，28）：尾音硬、带不服气
    7: { voice: longanhuan_v3.1, rate: 1.05, pitch: 1.02,
         instruction: "语气上扬带不服气，尾音硬" }
    # 8 号 赵泠汐（讲理+阴阳，37）：慢条斯理、字字清楚
    8: { voice: longwan_v3.1, rate: 0.98, pitch: 0.96,
         instruction: "慢条斯理、字字清楚，语气带一点讽刺" }
    # 9 号 虞汐颜（双魂双票，29）：故意不加指令 —— 人设就是"前后判若两人"
    9: { voice: longhua_v3.1, rate: 1.0, pitch: 1.0 }
    # 10 号 沈栖迟（装大人装不住，31）：想威严但底气不足
    10: { voice: longmiao_v3.1, rate: 1.02, pitch: 1.08,
          instruction: "想装威严但底气不足，尾音发虚" }
    # 11 号 安迟迟（高攻纸防，26）：前半气势足，后半越说越慢
    11: { voice: longxiaoxia_v3.1, rate: 1.08, pitch: 1.02,
          instruction: "一开始气势足，越说越慢、声音越小" }
  #
  # 老写法（只给音色名）照样能用，例如：
  #   1: longmiao_v3.1
  #   2: longhuohuo_v3.1
  #
  # ── 语音识别的**热词**（2026-10-08 加，用户反馈"错别字太多"）──────────────────
  # 为什么要它：你说话时"预言家/警徽/悍跳"这类词模型没见过几回，识别成同音字
  #（实测你那局把「警上」听成「井上」、「验人」听成「厌人」）。
  # 玩法：官方在同一个接口上支持**即时热词** —— `parameters.vocabulary = {词: 权重}`，
  #   不用建词表、不用拿 ID、**免费**；权重 1~5（建议 4），**50 = 超级热词**（最多 50 个）。
  # 规范（写错不报错、只是静默失效，所以这里帮你卡）：
  #   · 含中文的词总长 ≤15 字；纯英文按空格切 ≤7 段；
  #   · 每个模型最多 2000 个词；超级热词最多 50 个；
  #   · ⚠️ 只对 `qwen-audio-3.x-asr-flash` 系列有效 —— 换成 `qwen3-asr-flash` 要把这段删掉
  #     （那个系列不支持热词、参数名也不同）。来源见 docs/归档/历史变更日志.md §33。
  asr_hot_words:
    # 身份与规则词（最容易听错的一批）
    预言家: 4
    女巫: 4
    猎人: 4
    白痴: 4
    守卫: 4
    村民: 4
    狼人: 4
    悍跳: 50
    警徽: 4
    警长: 4
