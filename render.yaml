# Render Blueprint：一键部署（Docker 运行时）
# 用法：在 Render 里 New → Blueprint → 连这个仓库，它会照这份文件建服务。
services:
  - type: web
    name: werewolf
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # free 也能跑，但会休眠；starter 起才有常驻
    healthCheckPath: /api/status
    envVars:
      - key: WOLF_PAIR_CODE
        generateValue: false
        sync: false        # 部署时手填 6 位配对码（不填就每次重启随机生成）
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: werewolf-data
      mountPath: /app/games
      sizeGB: 1