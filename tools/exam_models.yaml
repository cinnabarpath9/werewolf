# 考核要测哪些模型 —— key 与**模型名**都只从 .env 取，绝不写进这个文件
# ⚠️ 2026-10-07：删掉了写死的 `model:` 字段。模型名以 .env 的 <PROFILE>_MODEL 为准；
#    想临时覆盖才在条目里写 `model: xxx`（例如测同一个平台的另一个型号）。
#    为什么这么改：DEEPSEEK 换成火山方舟后模型名大小写变了，而这里还写着旧名，
#    考试会拿旧名去请求新平台 —— 那是「同一份事实写两处」的必然结果。
# 条目字段：name（报告里的短标签）/ profile（决定 BASE_URL、KEY、MODEL）/ 温度 / max_tokens
#
# 这样才能横向比"分数 / 每次调用延迟 / 思考量"。
#   python tools/exam.py --dump ..\_verify_c_server\exam5.md

models:
  # ---- 第一梯队（早先跑过，现在用同一套新题库重跑，保证可比）----
  - name: DS
    profile: DEEPSEEK
    temperature: 0.2
    max_tokens: 16000

  - name: Qwen
    profile: QWEN
    temperature: 0.2
    max_tokens: 16000

  - name: GLM
    profile: GLM
    temperature: 0.2
    max_tokens: 16000

  # ---- 新加的两家（2026-10-06 用户提供）----
  - name: Doubao
    profile: ARK               # .env: DOUBAO_BASE_URL / DOUBAO_API_KEY
    temperature: 0.2
    max_tokens: 16000

  - name: MiMo
    profile: MIMO                 # .env: MIMO_BASE_URL / MIMO_API_KEY（小米自己的站）
    temperature: 0.2
    max_tokens: 16000
