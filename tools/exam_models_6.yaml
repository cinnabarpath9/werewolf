# 本次笔试考核的模型清单（2026-10-11 作者点名 6 个）
#
#   GLM   glm-5.3-flash（**火山方舟** —— 作者 2026-10-11 明确：GLM 也走火山渠道）
#   DS    DeepSeek-V4.1-Flash（火山）    Doubao Doubao-Seed-2.1-lite（火山）
#   Qwen  qwen3.8-flash（快米兔）
#   Haiku claude-haiku-5-5（快米兔单模型通道）
#   MiMo  mimo-v2.6-flash（小米自家站）
#
# ⚠️ 这个文件里**只写 profile 与采样参数**：端点、key 一律从环境变量取
#    （`<PROFILE>_BASE_URL` / `<PROFILE>_API_KEY`）。模型名默认取 `<PROFILE>_MODEL`，
#    需要"同渠道换型号"时才在这里写 `model:` 覆盖（GLM 就是这种情况：
#    它跟 Doubao/DS 共用火山的 ARK 端点与 key，但型号是 glm-5.3-flash）。
#    同一份事实写两处必然漂移（DEEPSEEK 换过平台、模型名大小写变过一次，就是这么踩的）。
#
# ⚠️ Haiku 的 key 不在 `.env` 里（作者放在桌面 txt 里给的），跑之前在当前终端导出：
#      $env:HAIKU_BASE_URL = "https://api.52pay.com/v1"
#      $env:HAIKU_MODEL    = "claude-haiku-5-5"
#      $env:HAIKU_API_KEY  = (Get-Content "C:\...\cc5.5.txt" -Raw).Trim()
#    key 只活在这一次终端会话里，**不进仓库、不进报告**。
#
# 温度统一 0.2：考试比的是"同一份卷子上的分数"，不是"谁更会发散"
# （真打牌时作者用的是每座位不同温度，那套多样性设计与这里无关）。
#
# ⚠️ 思考强度：**每个渠道都给它的"高档"参数**（作者要求：haiku 记得高思考强度）。
#    参数按 `wolf/llm.py` 的 `THINKING_LEVELS_BY_STYLE` 取，各平台名字不一样：
#      · 火山系（GLM / DS / Doubao）：{"thinking":{"type":"enabled"},"reasoning_effort":"high"}
#        —— 实测三家都回思考链（GLM 46 字 / Doubao 17 字 / DS 64 字，preflight 小题）
#      · Qwen：{"enable_thinking": True, "thinking_budget": 16384}
#      · 快米兔 Haiku（openai 风）：{"reasoning_effort": "high"}
#        —— 实测：这个通道**不回思考链**，但 `reasoning_effort=high` 会让它内部多想
#        （同一题的完成 token 881 → 1653，正文长度不变）。所以"看不见"不等于"没生效"。
#      · MiMo：{"thinking":{"type":"enabled"}}（官方只有开关，没有档位）
models:
  - name: GLM
    profile: ARK                 # 火山方舟（与 Doubao/DS 共用端点与 key）
    model: glm-5.3-flash         # ← 同渠道换型号，所以这里显式写
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high

  - name: Qwen
    profile: QWEN
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      enable_thinking: true
      thinking_budget: 16384

  - name: DS
    profile: DEEPSEEK
    temperature: 0.2
    # ⚠️ DS 的思考链会吃 token：预检时 max_tokens=16 全被思考占掉、正文为空。
    max_tokens: 20000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high

  - name: Doubao
    profile: ARK
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high

  - name: Haiku
    profile: HAIKU
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      reasoning_effort: high

  - name: MiMo
    profile: MIMO
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
