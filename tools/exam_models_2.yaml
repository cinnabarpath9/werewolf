# 并行补跑：Haiku + MiMo（为了不等 Doubao 那轮的 31 组慢慢跑）
#
# 为什么可以拆轮：Haiku 走快米兔、MiMo 走小米自家站，跟火山那三个渠道**不挤**；
# 拆分后各轮的逐题作答由 `tools/exam_merge.py` 合并成同一张对比表
# （它复现过 GLM 单轮报告的数字，口径与 `exam.py` 完全一致）。
#
#   Haiku claude-haiku-5-5（快米兔单模型通道，key 在作者桌面 txt 里）
#   MiMo  mimo-v2.6-flash（小米自家站）
#
# ⚠️ 跑之前导出：$env:HAIKU_BASE_URL / $env:HAIKU_MODEL / $env:HAIKU_API_KEY
# 温度统一 0.2；思考强度给各自的高档（参数名按 `wolf/llm.py` 的 THINKING_LEVELS_BY_STYLE）。
models:
  - name: Haiku
    profile: HAIKU
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      reasoning_effort: high

  - name: MiMo
    profile: MIMO
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
