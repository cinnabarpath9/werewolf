# J2 类模糊题 · 思考档位对照（作者 2026-10-13 授权）
# 卷子：`--bank hard`（34 道 / 19 组，含 8 道 J2 各占一组）
# ⚠️ 口径（作者 2026-10-14 拍板）：火山 glm 关不掉思考（发 disabled 会 400）⇒ 本清单的
#    「GLM-默认档」是**什么都不发**=平台默认（思考开着），**不是真关思考**，别与真 off 档对比。
# 档位参数照抄 `wolf/llm.py::THINKING_LEVELS_BY_STYLE`；同家三档共用同一套 max_tokens
models:
  - name: GLM-默认档
    profile: ARK
    model: glm-5.3-flash
    temperature: 0.2
    max_tokens: 16000
  - name: GLM-中
    profile: ARK
    model: glm-5.3-flash
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: low
  - name: GLM-高
    profile: ARK
    model: glm-5.3-flash
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high
  - name: 豆包-关
    profile: ARK
    model: Doubao-Seed-2.1-lite
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: disabled}
  - name: 豆包-中
    profile: ARK
    model: Doubao-Seed-2.1-lite
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: low
  - name: 豆包-高
    profile: ARK
    model: Doubao-Seed-2.1-lite
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high
  - name: DS-关
    profile: DEEPSEEK
    temperature: 0.2
    max_tokens: 20000
    extra_body:
      thinking: {type: disabled}
  - name: DS-中
    profile: DEEPSEEK
    temperature: 0.2
    max_tokens: 20000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: low
  - name: DS-高
    profile: DEEPSEEK
    temperature: 0.2
    max_tokens: 20000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high
