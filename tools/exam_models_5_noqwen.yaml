# 本次笔试考核的模型清单：**5 个（不含 Qwen）**
#
#   作者 2026-10-11 的指示：「先把 Qwen 停掉、让剩下 4 个先出成绩，然后先对比这 5 个」
#   ⇒ 这一轮考 GLM / DS / Doubao / Haiku / MiMo 五个；Qwen 的单独结果另外跑。
#
#   GLM   glm-5.3-flash（**火山方舟** —— 作者明确：GLM 也走火山渠道）
#   DS    DeepSeek-V4.1-Flash（火山）    Doubao Doubao-Seed-2.1-lite（火山）
#   Haiku claude-haiku-5-5（快米兔单模型通道，key 在作者桌面 txt 里）
#   MiMo  mimo-v2.6-flash（小米自家站）
#
# ⚠️ **为什么 Qwen 被停掉**（2026-10-11 实测，值得记下来）：
#   · 格式失败：X / S / V / 检索那几组判 0/10、0/9，原因是"题号没在回复里找到"——
#     它把编号写成了别的形式 ⇒ 在实战里同样是致命伤（引擎要 JSON 字段，格式不对动作会被兜底改随机）。
#   · 慢：一组 10 题跑了 **481s / 298s / 231s**（GLM 同组只要 5~15s）——
#     按这个速度，一个座位单次调用就可能顶到项目 450 秒的 `call_timeout`。
#   ⚠️ 这两条只说明"它在**这套卷子/这种格式要求**下表现差"，不代表它答不对题；
#      要分开看"格式没跟上"和"答错"，见报告里的逐题原始回答。
#
# ⚠️ 这个文件里**只写 profile 与采样参数**：端点、key 一律从环境变量取
#    （`<PROFILE>_BASE_URL` / `<PROFILE>_API_KEY`）。模型名默认取 `<PROFILE>_MODEL`，
#    需要"同渠道换型号"时才写 `model:` 覆盖（GLM 就是这种情况：它跟 Doubao/DS 共用
#    火山的 ARK 端点与 key，但型号是 glm-5.3-flash）。
#
# ⚠️ Haiku 的 key 不在 `.env` 里（作者放在桌面 txt 里给的），跑之前在当前终端导出：
#      $env:HAIKU_BASE_URL = "https://api.52pay.com/v1"
#      $env:HAIKU_MODEL    = "claude-haiku-5-5"
#      $env:HAIKU_API_KEY  = (Get-Content "C:\...\cc5.5.txt" -Raw).Trim()
#
# 温度统一 0.2：考试比的是"同一份卷子上的分数"，不是"谁更会发散"。
# 思考强度：每个渠道都给它的"高档"参数（参数名按 `wolf/llm.py` 的 THINKING_LEVELS_BY_STYLE）。
#   · 快米兔 Haiku 的思考链**不返回**，但 `reasoning_effort=high` 实测有效
#     （同一题完成 token 881 → 1653，正文长度不变）——看不见 ≠ 没生效。
models:
  - name: GLM
    profile: ARK                 # 火山方舟（与 Doubao/DS 共用端点与 key）
    model: glm-5.3-flash         # ← 同渠道换型号，所以这里显式写
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high

  - name: DS
    profile: DEEPSEEK            # .env: DeepSeek-V4.1-Flash（火山方舟）
    temperature: 0.2
    # ⚠️ DS 的思考链会吃 token：预检时 max_tokens=16 全被思考占掉、正文为空。
    max_tokens: 20000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high

  - name: Doubao
    profile: ARK                 # .env: Doubao-Seed-2.1-lite（火山方舟）
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high

  - name: Haiku
    profile: HAIKU               # 快米兔单模型通道：claude-haiku-5-5
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      reasoning_effort: high

  - name: MiMo
    profile: MIMO                # .env: mimo-v2.6-flash（小米自家站）
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
