# J2 类模糊题 · 思考档位对照（作者 2026-10-13 授权）
# 卷子：`--bank hard`（34 道 / 19 组，含 8 道 J2 各占一组）
#
# ⚠️ 本文件是 `tools/exam_j2_volcano.yaml` 的**分包副本**（2026-10-14 本轮实测时新建），
#    只留 `GLM-默认档` 一条臂，**参数一个字没改**。
#    · 「GLM-默认档」= **什么都不发**=平台默认（思考开着），**不是真关思考**，别与真 off 档对比；
#    · 火山 glm 关不掉思考（发 disabled 会 400）⇒ 它偏慢是**臂本身的特性**，不是清单写错。
#
# **为什么单独一包**：整包跑时它把 10 题的组反复劈半（10→5→3…）+ 空正文重试，
#    第 1 组 90 分钟没出结果 ⇒ 单独跑，别堵住其余 8 条臂（见 `exam_j2_volcano_a.yaml`）。
models:
  - name: GLM-默认档
    profile: ARK
    model: glm-5.3-flash
    temperature: 0.2
    max_tokens: 16000
