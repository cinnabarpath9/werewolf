# J2 类模糊题 · 思考档位对照（作者 2026-10-13 授权）
# 卷子：`--bank hard`（34 道 / 19 组，含 8 道 J2 各占一组）
#
# ⚠️ 本文件是 `tools/exam_j2_volcano.yaml` 的**分包副本**（2026-10-14 本轮实测时新建），
#    除删掉一条臂之外**一个字没改**；档位参数与冠名口径照抄原文件：
#    · 「GLM-默认档」是**什么都不发**=平台默认（思考开着），**不是真关思考**，别与真 off 档对比；
#    · 火山 glm 关不掉思考（发 disabled 会 400）。
#
# **为什么拆包**：`GLM-默认档` 这一臂在整包里把 10 题的组反复劈半 + 空正文重试，
#    第 1 组跑了 90 分钟还没出来（详见本轮报告「工具问题」那段）⇒ 它会把后面 8 条臂全堵住。
#    拆包只改**跑的顺序**，不改题目、不改参数、不改判分：8 条臂照原样跑，GLM-默认档 单独一包。
