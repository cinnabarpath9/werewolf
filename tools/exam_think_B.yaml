# 思考档位对照实验（作者 2026-10-11 要求）：
#   「MiMo、千问、豆包，测一下三个中/低思考在复杂题上的分数；三个快模型也测思考降档的正确率和成本」
# 卷子：`--bank hard`（复杂题：第一批 hard + 第二批 J/Z2/R）
# 档位参数**照抄项目自己的表** `wolf/llm.py::THINKING_LEVELS_BY_STYLE`（不自己发明参数）：
#   openai(Haiku): off=none / low=low / high=high      ark(DS/豆包): disabled / low / high
#   qwen: off=enable_thinking:false / low=budget 512 / 中(budget 4096，历史值) / high=budget 16384
#   glm(火山): **关不掉**（发 disabled 会 400）⇒ off 档=什么都不发
#   mimo(小米): 只有 enabled/disabled，**没有中档**（发 reasoning_effort 无效）
models:
  - name: 豆包-高
    profile: ARK
    model: Doubao-Seed-2.1-lite
    temperature: 0.2
    max_tokens: 20000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high
  - name: 豆包-中
    profile: ARK
    model: Doubao-Seed-2.1-lite
    temperature: 0.2
    max_tokens: 20000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: low
  - name: 豆包-低
    profile: ARK
    model: Doubao-Seed-2.1-lite
    temperature: 0.2
    max_tokens: 20000
    extra_body:
      thinking: {type: disabled}
