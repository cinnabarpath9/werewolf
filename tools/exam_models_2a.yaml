# 新卷子（35 道）补跑：GLM + DS 两个快的（Doubao 太慢，单独另跑）
#
# 背景：5 家一轮跑时 Doubao 卡在某组长时间不回包，把排在它后面的模型一起堵住了
# （`exam.py` 是**按清单顺序串行**跑的）。所以拆开：快的先出成绩。
#
#   GLM glm-5.3-flash（火山方舟）    DS DeepSeek-V4.1-Flash（火山方舟）
#
# 端点/ key 只从环境变量取（`ARK_BASE_URL` / `ARK_API_KEY`）；
# 温度 0.2；思考强度给火山系的"高档"（thinking.enabled + reasoning_effort=high）。
models:
  - name: GLM
    profile: ARK
    model: glm-5.3-flash
    temperature: 0.2
    max_tokens: 16000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high

  - name: DS
    profile: DEEPSEEK
    temperature: 0.2
    max_tokens: 20000
    extra_body:
      thinking: {type: enabled}
      reasoning_effort: high
