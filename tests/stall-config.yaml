# 测试用配置：把"模型"指向本地假上游（fake_llm.py），用来验证"上游波动 → 重试 → 暂停弹窗"。
# ⚠️ 只给 _verify_c_server 的自动化测试用，不要拿它当真配置跑。
game:
  board: eleven_wolfking   # 2026-10-30：默认板子（旧 eleven_dream 已退役）
  max_days: 1                 # 一天就收摊，测试跑得快
  save_dir: tests/tmp/games
  human_timeout: 60           # 测试里没人管人类座位时别等太久
  stall_timeout: 120          # 卡住之后等测试点按钮的秒数
  personas_dir: ""            # 人设不参与，省得读一堆 md
  experience: false

llm:
  default:
    base_url: http://127.0.0.1:8099/v1
    api_key_env: FAKE_KEY
    model: fake-model
    timeout: 10               # 假上游是本地进程，不需要长超时
    max_retries: 4            # ← 用户要的"最多 4 次重试"
    # ⚠️ 2026-10-11：重试之间的**退避基数**默认 1.5 秒（1.5/3/4.5/6 = 一手 15 秒）。
    #    本脚本断言的是**次数**（一手几次请求、打满几手弹窗，全部从配置现算），
    #    而那 15 秒×好几手让整条链要跑 150+ 秒 —— 所以测试里用 0.1 秒（= 0.1/0.2/0.3/0.4）。
    #    生产配置**不写这个键** ⇒ 行为与以前一字不差（同 `game.retry_backoff` 的做法）。
    retry_sleep: 0.1
    temperature: 1.0
    max_tokens: 400
    thinking: off             # 关思考，测试要快
    extra_body: {}
