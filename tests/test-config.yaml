# 狼人杀内核配置
#
# ── 模型地址和 key 在哪？──
# 都在同目录的 .env 里，一个平台三行（Base URL + Key + 模型名）：
#
#     QWEN_BASE_URL=https://maas.qianwenaiapi.com/compatible-mode/v1
#     QWEN_API_KEY=sk-xxx
#     QWEN_MODEL=qwen3.7-plus
#
# 这里只写 `profile: QWEN` 去引用它。这样换平台只改一个地方，也不会把 key 抄错。
#
# 座位级路由：每个座位可以用**不同的平台、不同的 key、不同的模型**。
# 优先级：llm.seats[座位号]  >  llm.roles[角色]  >  llm.default
#
# 提示：多平台多 key 只解决"限流/记账/故障隔离"，跟"谁能看到什么"无关 ——
#       信息隔离永远由代码里的上下文装配保证，不受 key 数量影响。

llm:
  # ⚠️⚠️ 2026-10-11 起：**这份配置只指向本地假上游**（`tests/fake_llm.py`，端口 8098）。
  #
  # 为什么（作者 2026-10-10 晚在账单里发现）：`t_cancel_paths.py` 第四节要用
  # **「真模型调用 + 立刻放弃」**验"取消时 transcript 干不干净"，它发的是 `mock: false`；
  # 而这份配置原来写的是**生产档案**（`profile: QWEN / DEEPSEEK / GLM`）——
  # 于是 8086 这台测试实例会**真的打用户的付费渠道**（实测一次全量跑出 3 次真实调用）。
  # ⚠️ `--mock-default` 只改"默认值"，那条显式 `mock: false` 正好绕过它。
  #
  # 现在整份 llm 都指向本地假上游 ⇒ **测试档从结构上不可能花钱**：
  # 假上游对每个请求回一份"超集 JSON"（所有 schema 都读得到字段），也能按需造 500 抖动。
  # `run_all.py` 会给这台实例拉起假上游，收尾时打印它的请求计数（= 证据）。
  # ⚠️ 改这份文件时**不许**再写指向外部渠道的 `base_url` / `profile` —— `tests/check_gates.py` 会拦。
  default:
    base_url: http://127.0.0.1:8098/v1
    api_key: fake-key-for-local-upstream     # 假上游不校验 key（也完全不读 .env）
    model: fake-model
    temperature: 1.0
    max_tokens: 4000        # ⚠️ 开了思考时输出可能上千 token，给小了会把 JSON 截断
    timeout: 200            # ⚠️ 开高思考时单次可能 60~120s，超时必须给宽，否则会误判超时
    max_retries: 2
    retry_sleep: 0.05       # 重试退避基数（测试要快；见 wolf/llm.py 的 _retry_wait）
    extra_body: {}          # 基础参数（下面的思考档位会覆盖它）

  # ── 思考强度：按「任务类型 + 第几天」决定（天数向上取，第 5 天用第 3 天那档）──
  #   off  = 关思考                    ~8s     事实题 72%
  #   low  = reasoning_effort=low      ~16s    事实题 90%
  #   high = reasoning_effort=high     ~114s   事实题 100%
  # 这套组合的理由（实测见 tools/bench_thinking.py）：
  #   · 发言是"把已经拿到的东西说人话"，关思考又快又不啰嗦，质量不掉
  #   · 决策（投票/验人/用药/刀人/开枪）才是 72%→100% 那 30 个百分点所在
  #   · 第 3 天起台账涨到 2~3k tokens、矛盾集中爆发，这时才值得上高思考
  thinking:
    speech:   {1: "off", 3: "low"}
    decision: {1: "low", 3: "high"}

  # 按角色覆盖（角色是 wolf / seer / witch / hunter / guard / villager）
  # 例：预言家最吃"精确回忆"，给它换强模型
  roles: {}
    # seer:
    #   model: qwen3.8-max

  # 按座位覆盖（优先级最高）。
  # ⚠️ 这里**只留采样参数**，不写 `profile:` —— 写了 profile 就会去 `.env` 取真实地址，
  #    那正是"测试真的花钱"的入口。温度档位保留下来，让"不同座位温度不同"在测试实例上仍成立。
  seats:
    1: { temperature: 0.7, max_tokens: 12000, extra_body: {"enable_thinking": true} }
    2: { temperature: 1.0, max_tokens: 16000 }
    3: { temperature: 1.3 }
    4: { temperature: 1.0, max_tokens: 12000, extra_body: {"enable_thinking": true} }
    5: { temperature: 1.3, max_tokens: 16000 }
    # 6 号是真人玩家
    7: { temperature: 0.7 }
    8: { temperature: 1.3, max_tokens: 12000, extra_body: {"enable_thinking": true} }
    9: { temperature: 0.7, max_tokens: 16000 }
    10: { temperature: 1.0 }

  # ⚠️ 这份是**测试实例**的配置：不许写 `profile:`（那会去 .env 取真实地址 ⇒ 真花钱）。
  #    要在真渠道上试，请改**项目根**的 config.yaml，或用 run_game.py / 手机端。

game:
  # ── 白天流程：决策在前、发言在后（自查发现原来挂到了 voice: 段下，等于没开）──
  decision_first: true
  # 板子决定人数和角色构成。产品内置四张：eleven_wolfking（默认）/ twelve_standard /
  # nine_all / six_all_reveal（2026-10-30 起；其余内置板子已退役）。
  board: eleven_standard

  # 自定义板子：写自己那套规则，任意人数（5~18）
  # ⚠️ 下面这四张是**退役的内置板子**（产品面板已经不提供）——测试实例把它们当自定义板子
  #    挂上，只为让那些"按板子名开局"的 WS 用例（t_human_path / t_isolation_push / …）
  #    继续能跑。名单与定义跟 wolf/retired_boards.py 一致。
  boards:
    eleven:
      roles: [wolf, wolf, wolf, wolf, seer, witch, hunter, guard,
              villager, villager, villager]
      win_rule: sides
      desc: 11 人（已退役的 eleven，仅测试用）
    eleven_standard:
      roles: [wolf, wolf, wolf, wolf, seer, witch, hunter, idiot,
              villager, villager, villager]
      win_rule: sides
      desc: 11 人（已退役的 eleven_standard，仅测试用）
    eleven_dream:
      roles: [wolf, wolf, wolf, wolf, seer, witch, dreamer, idiot,
              gravekeeper, crow, lucky]
      win_rule: sides
      desc: 11 人（已退役的 eleven_dream，仅测试用）
    eleven_guard:
      roles: [wolf, wolf, wolf, wolf, seer, witch, guard, idiot,
              villager, villager, villager]
      win_rule: sides
      desc: 11 人（已退役的 eleven_guard，仅测试用）

  human_seat: 0             # 0 = 全 AI；填 1..N 表示你坐这个座位（命令行 --human 可覆盖）
  seed: 0                   # 0 = 每次随机发牌（每局身份都会重排）
  max_days: 20              # 防止模型互相拖到天荒地老
  pk_on_tie: true           # 平票时：被票的几人各再发言一轮（PK），然后只在她们之间重投；
                            # 重投仍平票 → 本轮无人出局。关掉就是"平票直接无人出局"。
  wolf_control: true        # 狼人控场结算。判定是「存活狼数 ≥ 存活好人数」**并且**
                            # 好人已无夜间反击能力（预言家/女巫/猎人都不在了）——
                            # 只要这几种还有活人，就给他们最后一夜。
                            # 关掉（false）则完全不做控场判定，残局交给屠边/屠城。
  save_dir: 'tests/tmp/games'
  # ⚠️ 测试实例用**自己的**语音缓存目录（相对于这份配置所在目录 = tests/）。
  #    为什么（审查发现的 P3-5）：`server.py` 以前只认项目根的 config.yaml，于是
  #    `t_tts_cached.py` 那类"真的合成/写缓存"的脚本会往**线上共用**的
  #    `var/voice_cache` 里写、再删 —— 今天只是恰好没撞上，哪天有人把线上音色抄进这份
  #    配置，测试就会覆盖线上真实缓存条目。现在 server.py 认 `--config`，这里显式指开。
  voice_cache_dir: 'var/voice_cache'
  human_timeout: 900        # 手机端等你行动的秒数，超时就跳过这一手

  # ── 座位人设（一个模型演九种说话风格）──
  # 文件名就是座位号：personas/1.md、personas/2.md …
  # 只写"怎么说话"，不写"怎么判断"，更不能写任何身份/队友/信息（见 wolf/persona.py）
  personas_dir: personas    # 置空 = 关掉这个功能
  personas: {}              # 也可以单独指定： 3: personas/3.md  或  3: "你说话很短，爱用反问。"

  # ── 跨局经验 ──
  # false（默认）= 每局完全新开对话，什么都不继承。
  # true = 仍然是每局新开对话，只是把上几局**去身份化**的复盘笔记注入进去。
  # 为什么不直接继承上一局的对话，见 README「每局之间要不要继承上下文」。
  experience: false
  experience_dir: experience

# 语音：座位 → 音色（人设的性别跟音色要对上；听着不对就改这里，不用动代码）
# 可用音色一共 12 个：longanhuan / longmiao / longxing / longwan / longhua /
#   longxiaoxia / longyuan / longjielidou / longhuohuo / longsanshu / longzhe / longhan
#   （名字后面必须带 _v3.1，写错会直接合成失败）
voice:
  seats:
    1: longmiao_v3.1        # 女 · 温柔稳重
    2: longzhe_v3.1         # 男 · 直脾气
    3: longxing_v3.1        # 男 · 张扬（名字偏中性，听着像女声就换 longhuohuo/longjielidou）
    4: longxiaoxia_v3.1     # 女 · 冷静理性
    5: longyuan_v3.1        # 女 · 多疑
    7: longsanshu_v3.1      # 男 · 老成（年长男声）
    8: longhan_v3.1         # 男 · 圆滑
    9: longwan_v3.1         # 女 · 认真
    10: longhua_v3.1        # 女 · 细腻（名字偏中性，听着像男声就换 longanhuan）
